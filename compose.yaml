services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/home/node/app

  chat-api:
    build:
      context: .
      dockerfile: apps/chat-api/Dockerfile.dev
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - .:/home/node/app

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:4.52
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: local-access-key
      AWS_SECRET_ACCESS_KEY: local-secret-key
      S3_BUCKET: reports
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  s3-data:
